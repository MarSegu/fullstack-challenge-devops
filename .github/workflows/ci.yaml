name: CI Pipeline

on: 
  pull_request:
    branches:
      [devel, stage, prod]

jobs:
  build:
    runs-on: ubuntu-latest

    steps: 
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '15'

      - name: Enforce branching strategy
        if: github.event_name == 'pull_request'
        run: |
          if [[ "${{ github.event.pull_request.base.ref }}" == "stage" &&  "${{ github.event.pull_request.head.ref }}" != "dev"]]; then
            echo "Merge into stage can only be done from devel"
            exit 1
          fi
          if [[ "${{ github.event.pull_request.base.ref }}" == "prod" &&  "${{ github.event.pull_request.head.ref }}" != "stage"]]; then
            echo "Merge into prod can only be done from stage"
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Run formatter
        run: npm run prettier

      - name: Run tests
        env: 
          CI: true
        run: npm run test

      - name: Build project
        run: npm run build